name: Release

# Lançamento do SDK. Só manual e só da main. O Swift Package Manager publica pela
# tag do repositório; o pacote do código leva atestação de proveniência do GitHub.
# Pendente: assinar a tag com a chave de assinatura da Trusto, guardada no environment `release`.
#
# Proteções do repositório, configuradas no GitHub:
# - `main` só por PR, com o CI verde, sem push direto nem force-push;
# - environment `release` só da `main` e com aprovador obrigatório, que o job `release` usa;
# - tags imutáveis: o SPM resolve pela tag, e uma tag movida depois do lançamento entregaria
#   outro código a quem resolver de novo.
#
# Toda action fixada por SHA, com a versão em comentário.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão a lançar (x.y.z), igual à do CHANGELOG e de TrustoConsent.sdkVersion
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Testes sem nenhuma permissão de escrita: código de teste ou de plugin não alcança token
  # que mexa no repositório.
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Conferir versão
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          grep -q "sdkVersion = \"$VERSION\"" Sources/TrustoConsent/TrustoConsent.swift
          grep -q "^## $VERSION$" CHANGELOG.md
      - name: Testes
        run: swift test
      - name: Build para iOS
        run: xcodebuild -scheme TrustoConsent -destination 'generic/platform=iOS' build

  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Conferir versão
        env:
          VERSION: ${{ inputs.version }}
        run: echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - name: Pacote do código
        env:
          VERSION: ${{ inputs.version }}
        run: git archive --format=zip --output "TrustoConsent-$VERSION.zip" HEAD
      - name: Atestação de proveniência
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: TrustoConsent-${{ inputs.version }}.zip
      - name: Tag e release
        env:
          VERSION: ${{ inputs.version }}
          # O token só neste passo: os anteriores não o têm.
          GH_TOKEN: ${{ github.token }}
        # A tag aponta para o commit testado no job `verify`. Ainda sem assinatura própria (ver o topo).
        run: |
          awk -v v="## $VERSION" '$0==v{flag=1;next}/^## /{flag=0}flag' CHANGELOG.md > notes.md
          gh release create "$VERSION" "TrustoConsent-$VERSION.zip" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
