name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build
        run: swift build
      - name: Testes
        run: swift test
      - name: Build para iOS
        run: xcodebuild -scheme TrustoConsent -destination 'generic/platform=iOS' build
